# Timing: a high-threat emitter hits early, goes fully silent for well
# longer than staleness_norm_slots (default 200), then reappears late --
# tests whether the scheduler actually revisits a band it wrote off, or
# has permanently deprioritized it.
emitters:
  - kind: fixed
    id: gap_golf
    threat_level: 3
    band: 60
    duty_cycle: 0.5
    mean_burst_slots: 20
    power_dbm: 18.0
    power_jitter_std_db: 1.0
    active_windows: [[0, 300], [1700, 1950]]

  - kind: fixed
    id: filler_hotel
    threat_level: 1
    band: 10
    duty_cycle: 0.3
    mean_burst_slots: 30
    power_dbm: 5.0
    power_jitter_std_db: 2.0

  - kind: agile
    id: filler_india
    threat_level: 1
    hop_bands: [70, 80, 90]
    hop_dwell_slots: 25
    burst_duty_cycle: 0.4
    burst_mean_slots: 30
    power_dbm: 7.0
    power_jitter_std_db: 2.0
