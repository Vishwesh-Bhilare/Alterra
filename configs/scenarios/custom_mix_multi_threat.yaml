# Multi-threat mix matching GUI Custom Mix:
# Periodic scanner + fast hopper + fixed high-threat emitter
emitters:
  - kind: periodic_scan
    id: periodic_sweep_main
    threat_level: 2
    sweep_start_band: 99
    sweep_width: 14
    dwell_slots: 10
    duty_cycle: 0.8
    burst_mean_slots: 20
    power_dbm: 12.0
    power_jitter_std_db: 1.5

  - kind: agile
    id: fast_hopper_band90
    threat_level: 3
    hop_bands: [90, 92, 93, 94, 95]
    hop_dwell_slots: 4
    burst_duty_cycle: 0.8
    burst_mean_slots: 15
    power_dbm: 13.0
    power_jitter_std_db: 2.0

  - kind: fixed
    id: fixed_threat_111
    threat_level: 3
    band: 111
    duty_cycle: 0.5
    mean_burst_slots: 40
    power_dbm: 16.0
    power_jitter_std_db: 1.0
