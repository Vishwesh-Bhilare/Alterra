<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-labelledby="t d"><title id="t">CORTEX doctrine state machine</title><desc id="d">Explore, Investigate, Track and Relocate modes with the transitions that connect them</desc><defs><marker id="ah-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="ah-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8fa3c4"/></marker><linearGradient id="g-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#0f1b33"/></linearGradient><linearGradient id="g-cy" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#60a5fa"/></linearGradient></defs><rect width="1100" height="640" rx="18" fill="url(#g-bg)"/><text x="550" y="34" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#e6edf7" text-anchor="middle">Cognitive Doctrine State Machine</text><rect x="40" y="80" width="240" height="118" rx="14" fill="#111a2e" stroke="#34d399" stroke-width="2.2"/><text x="160" y="112" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#34d399" text-anchor="middle" letter-spacing="1.5">EXPLORE</text><text x="160" y="138" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#e6edf7" text-anchor="middle">spectrum coverage is poor</text><line x1="64" y1="154" x2="256" y2="154" stroke="#2a3a5c" stroke-width="1"/><text x="160" y="178" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8fa3c4" text-anchor="middle">dwell 3 slots (no evidence)</text><rect x="430" y="80" width="240" height="118" rx="14" fill="#111a2e" stroke="#60a5fa" stroke-width="2.2"/><text x="550" y="112" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#60a5fa" text-anchor="middle" letter-spacing="1.5">INVESTIGATE</text><text x="550" y="138" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#e6edf7" text-anchor="middle">strong recent evidence</text><line x1="454" y1="154" x2="646" y2="154" stroke="#2a3a5c" stroke-width="1"/><text x="550" y="178" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8fa3c4" text-anchor="middle">dwell 5 slots (weak evidence)</text><rect x="820" y="80" width="240" height="118" rx="14" fill="#111a2e" stroke="#22d3ee" stroke-width="2.2"/><text x="940" y="112" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#22d3ee" text-anchor="middle" letter-spacing="1.5">TRACK</text><text x="940" y="138" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#e6edf7" text-anchor="middle">target repeatedly detected</text><line x1="844" y1="154" x2="1036" y2="154" stroke="#2a3a5c" stroke-width="1"/><text x="940" y="178" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8fa3c4" text-anchor="middle">dwell 8 → 12 (confirmed → high)</text><rect x="430" y="340" width="240" height="118" rx="14" fill="#111a2e" stroke="#f87171" stroke-width="2.2"/><text x="550" y="372" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#f87171" text-anchor="middle" letter-spacing="1.5">RELOCATE</text><text x="550" y="398" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#e6edf7" text-anchor="middle">tracked enough / over-scanned</text><line x1="454" y1="414" x2="646" y2="414" stroke="#2a3a5c" stroke-width="1"/><text x="550" y="438" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8fa3c4" text-anchor="middle">band temporarily forbidden</text><path d="M280,139 L430,139" fill="none" stroke="#34d399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-green)"/><text x="355" y="128" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa3c4" text-anchor="middle">evidence</text><path d="M670,139 L820,139" fill="none" stroke="#60a5fa" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><text x="745" y="128" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa3c4" text-anchor="middle">confirmed</text><path d="M480,198 Q360,270 220,198" fill="none" stroke="#8fa3c4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-muted)" stroke-dasharray="6 5"/><text x="350" y="274" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa3c4" text-anchor="middle">evidence fades</text><path d="M940,198 Q940,399 670,399" fill="none" stroke="#22d3ee" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-cyan)"/><text x="956" y="300" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#22d3ee" text-anchor="start">after 3 revisits</text><path d="M430,399 Q130,399 130,198" fill="none" stroke="#f87171" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-red)"/><text x="150" y="370" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa3c4" text-anchor="start">ML picks the new region</text><path d="M900,80 C900,36 980,36 980,80" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-cyan)"/><text x="940" y="32" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa3c4" text-anchor="middle">target still active</text><rect x="40" y="500" width="1020" height="112" rx="14" fill="#16223b" stroke="#2a3a5c" stroke-width="1.5"/><text x="60" y="530" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#fbbf24" text-anchor="start" letter-spacing="1.5">ALWAYS-ON DOCTRINE CONSTRAINTS</text><rect x="60" y="546" width="204.0" height="28" rx="14.0" fill="#fbbf24" fill-opacity="0.14" stroke="#fbbf24" stroke-width="1.2"/><text x="162.0" y="564.32" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle">MAX_TRACK_REVISITS = 3</text><rect x="276.0" y="546" width="252.0" height="28" rx="14.0" fill="#fbbf24" fill-opacity="0.14" stroke="#fbbf24" stroke-width="1.2"/><text x="402.0" y="564.32" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle">avoid recently scanned bands</text><rect x="540.0" y="546" width="228.0" height="28" rx="14.0" fill="#fbbf24" fill-opacity="0.14" stroke="#fbbf24" stroke-width="1.2"/><text x="654.0" y="564.32" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle">minimum spectrum coverage</text><rect x="60" y="582" width="316.0" height="28" rx="14.0" fill="#fbbf24" fill-opacity="0.14" stroke="#fbbf24" stroke-width="1.2"/><text x="218.0" y="600.32" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle">forced relocation after confirmation</text><rect x="388.0" y="582" width="340.0" height="28" rx="14.0" fill="#fbbf24" fill-opacity="0.14" stroke="#fbbf24" stroke-width="1.2"/><text x="558.0" y="600.32" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle">candidate mask applied before ML argmax</text></svg>