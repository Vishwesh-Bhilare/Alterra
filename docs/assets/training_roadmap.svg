<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="t d"><title id="t">CORTEX progression and training pipeline</title><desc id="d">From traditional scanning to rule-based, hybrid and fully learned schedulers; hybrid trained by imitation then PPO fine-tuning</desc><defs><marker id="ah-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="ah-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8fa3c4"/></marker><linearGradient id="g-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#0f1b33"/></linearGradient><linearGradient id="g-cy" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#60a5fa"/></linearGradient></defs><rect width="1100" height="560" rx="18" fill="url(#g-bg)"/><text x="550" y="34" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#e6edf7" text-anchor="middle">Evolution and Training Pipeline</text><rect x="30" y="64" width="230" height="104" rx="14" fill="#111a2e" stroke="#64748b" stroke-width="1.6"/><circle cx="60" cy="96" r="14" fill="#64748b"/><text x="60" y="101" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#0b1220" text-anchor="middle">1</text><text x="82" y="101" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#e6edf7" text-anchor="start">Traditional scanning</text><text x="54" y="140" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa3c4" text-anchor="start">fixed / linear sweep</text><path d="M260,116 L300,116" fill="none" stroke="#8fa3c4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-muted)"/><rect x="300" y="64" width="230" height="104" rx="14" fill="#111a2e" stroke="#fbbf24" stroke-width="1.6"/><circle cx="330" cy="96" r="14" fill="#fbbf24"/><text x="330" y="101" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#0b1220" text-anchor="middle">2</text><text x="352" y="101" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#e6edf7" text-anchor="start">Rule-based cognitive</text><text x="324" y="140" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa3c4" text-anchor="start">doctrine + heuristics</text><path d="M530,116 L570,116" fill="none" stroke="#8fa3c4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-muted)"/><rect x="570" y="64" width="230" height="104" rx="14" fill="#0e2a3a" stroke="#22d3ee" stroke-width="2.6"/><circle cx="600" cy="96" r="14" fill="#22d3ee"/><text x="600" y="101" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#0b1220" text-anchor="middle">3</text><text x="622" y="101" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#e6edf7" text-anchor="start">Hybrid rule + ML</text><text x="594" y="140" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#22d3ee" text-anchor="start">CORTEX</text><path d="M800,116 L840,116" fill="none" stroke="#8fa3c4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-muted)"/><rect x="840" y="64" width="230" height="104" rx="14" fill="#111a2e" stroke="#a78bfa" stroke-width="1.6"/><circle cx="870" cy="96" r="14" fill="#a78bfa"/><text x="870" y="101" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#0b1220" text-anchor="middle">4</text><text x="892" y="101" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#e6edf7" text-anchor="start">Fully learned</text><text x="864" y="140" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa3c4" text-anchor="start">end-to-end policy</text><rect x="610" y="176" width="150" height="24" rx="12.0" fill="#22d3ee" fill-opacity="1" stroke="#22d3ee" stroke-width="1.2"/><text x="685.0" y="191.96" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0b1220" text-anchor="middle">THIS RELEASE</text><text x="550" y="236" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf7" text-anchor="middle">How the hybrid scheduler is trained</text><rect x="40" y="258" width="480" height="190" rx="14" fill="#111a2e" stroke="#fbbf24" stroke-width="1.8"/><rect x="58" y="274" width="80" height="24" rx="12.0" fill="#fbbf24" fill-opacity="1" stroke="#fbbf24" stroke-width="1.2"/><text x="98.0" y="289.96" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0b1220" text-anchor="middle">STAGE 1</text><text x="150" y="292" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf7" text-anchor="start">Imitation of the doctrine</text><text x="60" y="330" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa3c4" text-anchor="start">• Rule-based scheduler acts as teacher</text><text x="60" y="352" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa3c4" text-anchor="start">• Roll out thousands of seeded episodes</text><text x="60" y="374" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa3c4" text-anchor="start">• Record (observation, chosen band) pairs</text><text x="60" y="396" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa3c4" text-anchor="start">• Train the LSTM / GRU utility head to imitate</text><path d="M520,353 L580,353" fill="none" stroke="#8fa3c4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-muted)"/><rect x="580" y="258" width="480" height="190" rx="14" fill="#111a2e" stroke="#22d3ee" stroke-width="1.8"/><rect x="598" y="274" width="80" height="24" rx="12.0" fill="#22d3ee" fill-opacity="1" stroke="#22d3ee" stroke-width="1.2"/><text x="638.0" y="289.96" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0b1220" text-anchor="middle">STAGE 2</text><text x="690" y="292" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf7" text-anchor="start">RL fine-tuning (optional)</text><text x="600" y="330" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa3c4" text-anchor="start">• PPO fine-tunes only the band-selection policy</text><text x="600" y="352" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa3c4" text-anchor="start">• Doctrine mask stays active at every step</text><text x="600" y="374" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa3c4" text-anchor="start">• Aims for a better, more adaptive policy</text><text x="600" y="396" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa3c4" text-anchor="start">• Compared on identical seeds and metrics</text><rect x="40" y="474" width="1020" height="54" rx="12" fill="#16223b" stroke="#34d399" stroke-width="1.4"/><text x="550" y="497" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#34d399" text-anchor="middle" letter-spacing="1.5">Why it works</text><text x="550" y="517" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#e6edf7" text-anchor="middle">Starting from the heuristic is easier than PPO from random behaviour, and the mask rules out degenerate camping on one band.</text></svg>