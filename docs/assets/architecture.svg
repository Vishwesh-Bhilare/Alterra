<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="790" viewBox="0 0 1100 790" role="img" aria-labelledby="t d"><title id="t">CORTEX / Alterra system architecture</title><desc id="d">Layered simulation (SpectrumWorld, SensorModel, Gymnasium environment) with pluggable schedulers and outputs</desc><defs><marker id="ah-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="ah-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8fa3c4"/></marker><linearGradient id="g-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#0f1b33"/></linearGradient><linearGradient id="g-cy" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#60a5fa"/></linearGradient></defs><rect width="1100" height="790" rx="18" fill="url(#g-bg)"/><text x="550" y="34" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#e6edf7" text-anchor="middle">System Architecture</text><rect x="40" y="56" width="520" height="40" rx="10" fill="#16223b" stroke="#2a3a5c" stroke-width="1.5"/><text x="300" y="82" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="500" fill="#8fa3c4" text-anchor="middle">configs/*.yaml  ·  timing · spectrum · sensor noise · emitter populations</text><path d="M300,96 L300,118" fill="none" stroke="#8fa3c4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-muted)"/><rect x="40" y="118" width="520" height="136" rx="14" fill="#111a2e" stroke="#60a5fa" stroke-width="1.8"/><rect x="58" y="132" width="68" height="24" rx="12.0" fill="#60a5fa" fill-opacity="1" stroke="#60a5fa" stroke-width="1.2"/><text x="92.0" y="147.96" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0b1220" text-anchor="middle">LAYER A</text><text x="140" y="150" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e6edf7" text-anchor="start">SpectrumWorld</text><text x="60" y="180" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa3c4" text-anchor="start">• Fixed emitters (continuous / pulsed)</text><text x="60" y="200" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa3c4" text-anchor="start">• Frequency-hopping agile emitters</text><text x="60" y="220" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa3c4" text-anchor="start">• Periodic scanning (sweeping) radars</text><text x="60" y="240" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa3c4" text-anchor="start">• TSRD adapter for real PDW pulse trains</text><path d="M300,254 L300,290" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><text x="312" y="276" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa3c4" text-anchor="start">ground-truth occupancy</text><rect x="40" y="290" width="520" height="112" rx="14" fill="#111a2e" stroke="#fbbf24" stroke-width="1.8"/><rect x="58" y="304" width="68" height="24" rx="12.0" fill="#fbbf24" fill-opacity="1" stroke="#fbbf24" stroke-width="1.2"/><text x="92.0" y="319.96" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0b1220" text-anchor="middle">LAYER B</text><text x="140" y="322" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e6edf7" text-anchor="start">SensorModel</text><text x="60" y="352" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa3c4" text-anchor="start">• Thermal noise floor (−95 to −85 dBm)</text><text x="60" y="372" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa3c4" text-anchor="start">• SNR-dependent detection probability Pd(SNR)</text><text x="60" y="392" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa3c4" text-anchor="start">• False-alarm rate Pfa and reading noise</text><path d="M300,402 L300,438" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-amber)"/><text x="312" y="424" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa3c4" text-anchor="start">dwell result / power (dBm)</text><rect x="40" y="438" width="520" height="140" rx="14" fill="#111a2e" stroke="#34d399" stroke-width="1.8"/><rect x="58" y="452" width="68" height="24" rx="12.0" fill="#34d399" fill-opacity="1" stroke="#34d399" stroke-width="1.2"/><text x="92.0" y="467.96" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0b1220" text-anchor="middle">LAYER C</text><text x="140" y="470" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e6edf7" text-anchor="start">Alterra Gymnasium Environment</text><text x="60" y="500" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa3c4" text-anchor="start">• Observation: per-band tracks (threat, confidence, time since</text><text x="60" y="520" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa3c4" text-anchor="start">  hit / visit, ever-hit / ever-visited) + receiver state</text><text x="60" y="540" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa3c4" text-anchor="start">• Action: band + dwell duration  (3 / 5 / 8 / 12 slots)</text><text x="60" y="560" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa3c4" text-anchor="start">• Reward: hit, tracking bonus, signal-loss &amp; empty-dwell penalty</text><rect x="620" y="118" width="440" height="460" rx="14" fill="#111a2e" stroke="#2a3a5c" stroke-width="1.5" stroke-dasharray="6 5"/><text x="840" y="146" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#8fa3c4" text-anchor="middle">Pluggable schedulers · same env · same metrics</text><rect x="640" y="166" width="400" height="96" rx="12" fill="#16223b" stroke="#64748b" stroke-width="1.5"/><text x="660" y="196" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf7" text-anchor="start">Traditional sweep</text><text x="660" y="220" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa3c4" text-anchor="start">Fixed / linear frequency sweep.</text><text x="660" y="239" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa3c4" text-anchor="start">Blind to emitter activity.</text><rect x="640" y="282" width="400" height="100" rx="12" fill="#16223b" stroke="#a78bfa" stroke-width="1.5"/><text x="660" y="312" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf7" text-anchor="start">Pure-RL baselines</text><text x="660" y="336" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa3c4" text-anchor="start">PPO, PPO + LSTM, PPO + Transformer.</text><text x="660" y="355" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa3c4" text-anchor="start">Unconstrained: can collapse onto empty bands.</text><rect x="640" y="414" width="400" height="146" rx="12" fill="#0e2a3a" stroke="#22d3ee" stroke-width="2.4"/><text x="660" y="444" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#22d3ee" text-anchor="start">CORTEX Hybrid Scheduler</text><text x="660" y="470" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#e6edf7" text-anchor="start">Rule-based doctrine  +  ML band-utility model</text><text x="660" y="489" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#e6edf7" text-anchor="start">(LSTM / GRU) with candidate masking and</text><text x="660" y="508" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#e6edf7" text-anchor="start">rule-based dwell. Learns where to look next,</text><text x="660" y="527" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#e6edf7" text-anchor="start">inside doctrine constraints.</text><path d="M560,508 L640,508" fill="none" stroke="#22d3ee" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-cyan)" marker-start="url(#ah-cyan)"/><path d="M300,578 L300,614" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="155" y1="614" x2="935" y2="614" stroke="#34d399" stroke-width="2"/><path d="M155,614 L155,652" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-green)"/><rect x="40" y="652" width="230" height="78" rx="12" fill="#111a2e" stroke="#2a3a5c" stroke-width="1.5"/><text x="155" y="684" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf7" text-anchor="middle">Qt6 Desktop GUI</text><text x="155" y="708" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8fa3c4" text-anchor="middle">live waterfall + decisions</text><path d="M415,614 L415,652" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-green)"/><rect x="300" y="652" width="230" height="78" rx="12" fill="#111a2e" stroke="#2a3a5c" stroke-width="1.5"/><text x="415" y="684" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf7" text-anchor="middle">alterra CLI</text><text x="415" y="708" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8fa3c4" text-anchor="middle">headless sim &amp; evaluation</text><path d="M675,614 L675,652" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-green)"/><rect x="560" y="652" width="230" height="78" rx="12" fill="#111a2e" stroke="#2a3a5c" stroke-width="1.5"/><text x="675" y="684" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf7" text-anchor="middle">ESM Metrics</text><text x="675" y="708" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8fa3c4" text-anchor="middle">Pd · Pfa · intercept rate</text><path d="M935,614 L935,652" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-green)"/><rect x="820" y="652" width="230" height="78" rx="12" fill="#111a2e" stroke="#2a3a5c" stroke-width="1.5"/><text x="935" y="684" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf7" text-anchor="middle">PDW export</text><text x="935" y="708" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8fa3c4" text-anchor="middle">→ deinterleaving (TSRD)</text><text x="550" y="764" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa3c4" text-anchor="middle">Simulation and model packages never import each other's internals; schedulers talk to the env only through AlterraEnv.</text></svg>