xt x="682.5" y="579" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#8fa3c4" text-anchor="middle">sweep</text><rect x="790" y="202" width="370" height="400" rx="14" fill="#111a2e" stroke="#2a3a5c" stroke-width="1.5"/><text x="975" y="232" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf7" text-anchor="middle">Median reward</text><text x="975" y="252" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8fa3c4" text-anchor="middle">robustness · no collapse onto empty bands</text><line x1="810" y1="484.44444444444446" x2="1140" y2="484.44444444444446" stroke="#8fa3c4" stroke-width="1"/><rect x="830.0" y="310.4" width="70.0" height="174.1" rx="5" fill="#22d3ee"/><text x="865.0" y="302.37037037037044" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#e6edf7" text-anchor="middle">+3.76</text><text x="865.0" y="564" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#8fa3c4" text-anchor="middle">Hybrid GRU</text><rect x="940.0" y="484.4" width="70.0" height="11.6" rx="5" fill="#f87171"/><text x="975.0" y="512.0185185185185" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#e6edf7" text-anchor="middle">-0.25</text><text x="975.0" y="564" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#8fa3c4" text-anchor="middle">PPO +</text><text x="975.0" y="579" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#8fa3c4" text-anchor="middle">LSTM</text><rect x="1050.0" y="484.4" width="70.0" height="28.7" rx="5" fill="#f87171"/><text x="1085.0" y="529.1481481481482" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#